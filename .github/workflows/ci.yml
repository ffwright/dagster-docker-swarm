name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locked:
    name: Lint and test (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --frozen --extra dev ruff check src tests
      - run: uv run --frozen --extra dev pytest -q

  compatibility:
    # The oldest row installs the lowest versions pyproject.toml allows
    # (dagster 1.9.0, docker 7.0.0), so a raised floor is caught here.
    name: Python ${{ matrix.python }} (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            resolution: lowest-direct
          - python: "3.10"
            resolution: highest
          - python: "3.12"
            resolution: highest
          - python: "3.14"
            resolution: highest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - env:
          PYTHON: ${{ matrix.python }}
          RESOLUTION: ${{ matrix.resolution }}
        run: >-
          uv run --isolated --no-project --python "$PYTHON"
          --resolution "$RESOLUTION" --with-editable '.[dev]'
          -- pytest -q
